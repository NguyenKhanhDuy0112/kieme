<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Danh sách đơn — Kiemi Demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Danh sách đơn nghỉ</h1>
      <p class="hint" id="sync-hint" hidden></p>
      <div class="actions" style="margin-bottom: 12px">
        <button type="button" class="btn" id="reload">Tải lại</button>
        <span id="loading" hidden>Đang tải…</span>
      </div>
      <table class="table" id="requests-table">
        <thead>
          <tr><th>Mã đơn</th><th>Người tạo</th><th>Loại nghỉ</th><th>Từ ngày</th><th>Số ngày</th><th>Lý do</th><th>Trạng thái</th><th>Thao tác</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
    <script type="module" src="/src/requests.ts"></script>
  </body>
</html>
