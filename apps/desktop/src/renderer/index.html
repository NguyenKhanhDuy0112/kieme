<!doctype html>
<html lang="vi">

    <link rel="stylesheet" href="/splash.css" />

          <path d="M46 64 L36 22 L82 46 Z M154 64 L164 22 L118 46 Z" fill="#5b6cd6" />
          <ellipse cx="100" cy="112" rx="70" ry="74" fill="#5b6cd6" />

          <ellipse class="splash-wing-r" cx="164" cy="128" rx="15" ry="30" fill="#3f4fb0" />

            <circle cx="129" cy="85" r="4.5" fill="#fff" />
          </g>
          <path d="M100 104 L91 114 Q100 121 109 114 Z" fill="#f5b83d" />

      </div>
      <div class="splash-name">Kiemi</div>
      <div class="splash-slogan">Bấm một lần, kiểm mãi mãi.</div>
      <div class="splash-progress"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
